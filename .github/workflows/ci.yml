name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SDK_VERSION: 0.0.0-smoke.${{ github.run_id }}.${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            executable: CMakeWorkflow
            consumer: CMakeWorkflow.Client.AotSmoke
          - os: macos-26
            rid: osx-arm64
            executable: CMakeWorkflow
            consumer: CMakeWorkflow.Client.AotSmoke
          - os: windows-latest
            rid: win-x64
            executable: CMakeWorkflow.exe
            consumer: CMakeWorkflow.Client.AotSmoke.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Use tagged release version for SDK and native binaries
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Expected a SemVer tag such as v1.0.0 or v1.0.0-rc.1; got $env:GITHUB_REF_NAME"
          }
          "SDK_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build zlib1g-dev
      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y
      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build solution
        run: dotnet build CMakeWorkflow.slnx -c Release
      - name: Pure workflow SDK checks
        run: dotnet CMakeWorkflow.Contracts.Tests/bin/Release/net10.0/CMakeWorkflow.Contracts.Tests.dll
      - name: Campaign checks
        run: dotnet CMakeWorkflow.Campaigns.Tests/bin/Release/net10.0/CMakeWorkflow.Campaigns.Tests.dll
      - name: Generic CMake integration
        run: dotnet tests/bin/Release/net10.0/CMakeWorkflow.IntegrationTests.dll bin/Release/net10.0/${{ matrix.executable }}
      - name: Build isolated recovery fault-injection CLI
        run: dotnet publish CMakeWorkflow.csproj -c Release -p:PublishAot=false -p:RecoveryFaultInjection=true --artifacts-path out/recovery-artifacts -o out/recovery-cli
      - name: Recovery faults and manual reconciliation
        run: dotnet tests/bin/Release/net10.0/CMakeWorkflow.IntegrationTests.dll out/recovery-cli/${{ matrix.executable }} --recovery
      - name: History checks
        run: dotnet CMakeWorkflow.History.Tests/bin/Release/net10.0/CMakeWorkflow.History.Tests.dll
      - name: Profiling checks
        run: dotnet CMakeWorkflow.Profiling.Tests/bin/Release/net10.0/CMakeWorkflow.Profiling.Tests.dll
      - name: Tool provisioning checks
        run: dotnet CMakeWorkflow.Tooling.Tests/bin/Release/net10.0/CMakeWorkflow.Tooling.Tests.dll
      - name: Host IPC and session checks
        run: dotnet CMakeWorkflow.Host.Tests/bin/Release/net10.0/CMakeWorkflow.Host.Tests.dll
      - name: Windows host provisioning CLI plan (read-only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requirements = Join-Path $env:RUNNER_TEMP 'cmwf-windows-requirements.json'
          $payload = @{
            schemaVersion = 1
            toolProfiles = @('native')
            windowsPowerScheme = '381b4222-f694-41f0-9685-ff5bb260df2e'
          } | ConvertTo-Json -Compress
          Set-Content -LiteralPath $requirements -Value $payload -Encoding utf8
          $output = & dotnet bin/Release/net10.0/CMakeWorkflow.dll env plan $requirements --json
          if ($LASTEXITCODE -ne 0) { throw "env plan exit code: $LASTEXITCODE" }
          $plan = ($output -join "`n") | ConvertFrom-Json
          if ($plan.schemaVersion -ne 1 -or
              $plan.approvalSha256 -notmatch '^[A-Fa-f0-9]{64}$' -or
              $plan.findings.id -notcontains 'windows_power_scheme') {
            throw 'Windows environment plan missing required fields'
          }
          if (@($plan.systemChanges | Where-Object { $_.id -ne 'windows_power_scheme' }).Count -gt 0) {
            throw 'Unexpected Windows host setting in plan'
          }
          Write-Host 'Windows env plan JSON smoke passed (read-only).'
      - name: Publish NativeAOT CLI and Host
        shell: pwsh
        run: dotnet publish CMakeWorkflow.csproj -c Release -r ${{ matrix.rid }} -o out/native -p:Version=$env:SDK_VERSION -p:TreatWarningsAsErrors=true
      - name: Pack NuGet contracts and client SDK
        shell: pwsh
        run: |
          dotnet pack CMakeWorkflow.Contracts/CMakeWorkflow.Contracts.csproj -c Release -p:Version=$env:SDK_VERSION -p:PackageVersion=$env:SDK_VERSION -p:TreatWarningsAsErrors=true -o out/sdk-packages
          if ($LASTEXITCODE -ne 0) { throw "Contracts pack failed: $LASTEXITCODE" }
          dotnet pack CMakeWorkflow.Client/CMakeWorkflow.Client.csproj -c Release -p:Version=$env:SDK_VERSION -p:PackageVersion=$env:SDK_VERSION -p:TreatWarningsAsErrors=true -o out/sdk-packages
          if ($LASTEXITCODE -ne 0) { throw "Client pack failed: $LASTEXITCODE" }
      - name: Publish NativeAOT consumer from NuGet
        shell: pwsh
        run: |
          $packages = (Resolve-Path out/sdk-packages).Path
          dotnet publish CMakeWorkflow.Client.AotSmoke/CMakeWorkflow.Client.AotSmoke.csproj -c Release -r ${{ matrix.rid }} -p:SdkPackageVersion=$env:SDK_VERSION "-p:RestoreAdditionalProjectSources=$packages" -p:TreatWarningsAsErrors=true --artifacts-path out/sdk-smoke-artifacts -o out/sdk-aot
      - name: Audit NuGet package and consumer dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/smoke-logs | Out-Null
          & out/sdk-aot/${{ matrix.consumer }} --verify-package "out/sdk-packages/CMakeWorkflow.Client.$env:SDK_VERSION.nupkg" out/sdk-smoke-artifacts/obj/CMakeWorkflow.Client.AotSmoke/project.assets.json $env:SDK_VERSION 2>&1 | Tee-Object out/smoke-logs/package-audit.log
          if ($LASTEXITCODE -ne 0) { throw "Package audit failed: $LASTEXITCODE" }
      - name: NativeAOT Host IPC smoke
        shell: pwsh
        run: ./scripts/ci-native-smoke.ps1 -Cli out/native/${{ matrix.executable }} -Consumer out/sdk-aot/${{ matrix.consumer }}
      - name: Publish isolated NativeAOT RPC cancellation test Host
        run: dotnet publish CMakeWorkflow.csproj -c Release -r ${{ matrix.rid }} -p:RpcCancellationTesting=true -p:TreatWarningsAsErrors=true --artifacts-path out/rpc-test-artifacts -o out/rpc-test-native
      - name: NativeAOT in-flight request cancellation
        shell: pwsh
        run: ./scripts/ci-native-smoke.ps1 -Cli out/rpc-test-native/${{ matrix.executable }} -Consumer out/sdk-aot/${{ matrix.consumer }} -InFlight -LogDirectory out/smoke-logs/inflight
      - name: NativeAOT smoke
        shell: bash
        env:
          CLI: out/native/${{ matrix.executable }}
        run: |
          "$CLI" workflow plan examples/hello/workflow.json
          # The benchmark and matrix recipes adopt the existing CMake tree.
          # Execute the managed hello workflow first; planning alone does not configure it.
          "$CLI" workflow run examples/hello/workflow.json --results-dir out/history-auto-smoke --history-db out/history-auto-smoke/history.sqlite
          "$CLI" workflow generate benchmark --build-dir out/hello --target hello --config Debug --repeats 1 --timeout-seconds 30 --output out/benchmark-smoke/workflow.json
          "$CLI" workflow plan out/benchmark-smoke/workflow.json
          "$CLI" tooling list --json
          "$CLI" tooling plan cmake --pm none --json
          mkdir -p out/history-smoke/run
          printf '%s\n' '{"schemaVersion":1,"workflow":"smoke","manifestHash":"test","startedAt":"2026-01-01T00:00:00Z","finishedAt":"2026-01-01T00:00:01Z","status":"succeeded","nodes":[]}' > out/history-smoke/run/run.json
          "$CLI" history import out/history-smoke/run --db out/history-smoke/history.sqlite
          "$CLI" history runs --db out/history-smoke/history.sqlite --json
          "$CLI" workflow generate test-matrix --build-dir out/hello --target hello --label smoke --output out/benchmark-smoke/test-matrix.json
          "$CLI" workflow plan out/benchmark-smoke/test-matrix.json
          "$CLI" workflow generate build-matrix --variant main=out/hello --target hello --output out/benchmark-smoke/build-matrix.json
          "$CLI" workflow plan out/benchmark-smoke/build-matrix.json
          "$CLI" history runs --db out/history-auto-smoke/history.sqlite --json > out/smoke-logs/native-history.json
          grep -q '"workflow":"' out/smoke-logs/native-history.json
      - name: Prepare downloadable archives
        shell: pwsh
        run: ./scripts/ci-package-artifacts.ps1 -Rid ${{ matrix.rid }}
      - name: Upload tested native binaries and NuGet SDK
        uses: actions/upload-artifact@v4
        with:
          name: CMakeWorkflow-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/distribution/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/smoke-logs/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download tested platform distributions
        uses: actions/download-artifact@v4
        with:
          pattern: CMakeWorkflow-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/release-inputs
      - name: Verify and assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/release-assets
          for rid in linux-x64 win-x64 osx-arm64; do
            source="out/release-inputs/CMakeWorkflow-${rid}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            test -f "$source/SHA256SUMS"
            (cd "$source" && sha256sum --check SHA256SUMS)
            cp "$source/CMakeWorkflow-${rid}.tar.gz" out/release-assets/
            cp "$source/build.json" "out/release-assets/build-${rid}.json"
          done
          version="${GITHUB_REF_NAME#v}"
          packages="out/release-inputs/CMakeWorkflow-linux-x64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for id in CMakeWorkflow.Client CMakeWorkflow.Contracts; do
            package="$packages/${id}.${version}.nupkg"
            test -f "$package"
            cp "$package" out/release-assets/
          done
          (cd out/release-assets && sha256sum *.tar.gz *.nupkg *.json > SHA256SUMS)
      - name: Create immutable tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          options=(--verify-tag --generate-notes --title "CMakeWorkflow ${GITHUB_REF_NAME}")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
          # Deliberately fail on an existing Release; a rerun must not silently replace assets.
          gh release create "$GITHUB_REF_NAME" out/release-assets/* "${options[@]}"
