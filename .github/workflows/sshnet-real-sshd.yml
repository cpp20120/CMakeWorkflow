name: SSH.NET real sshd integration

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      vcpkg:
        description: Run the real managed vcpkg installation and upstream experiment
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  real-sshd:
    name: SSH.NET real-sshd lifecycle (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Real SSH.NET handshake, ephemeral workflow and persistent reconnect
        shell: bash
        env:
          CMWF_SSHNET_TEST_VCPKG: ${{ inputs.vcpkg && '1' || '0' }}
        run: bash tests/infrastructure/sshnet/run-tests.sh
